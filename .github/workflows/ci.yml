name: Test and build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: node --test tests/*.test.js
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: cat-village-demo
          path: dist/
